<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>ใบสมัครงาน — PAYI</title>
<style>
  :root {
    --mint: #2563eb; --mint-strong: #0b63d8; --mint-soft: #eaf3ff;
    --surface: #ffffff; --surface-muted: #f7fbff; --border: #dbe3ef;
    --text: #111827; --muted: #64748b; --faint: #94a3b8; --danger: #ef4444;
    --bg: #eef4fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 20px 14px; }
  header .brand { font-size: 12px; font-weight: 800; color: var(--mint-strong); letter-spacing: .06em; text-transform: uppercase; }
  header h1 { margin: 4px 0 10px; font-size: 22px; font-weight: 850; }
  .progress-track { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--mint), #34d399); transition: width .25s ease; }
  .step-label { margin-top: 8px; font-size: 12px; color: var(--muted); }
  main { flex: 1; padding: 4px 20px 100px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12); }
  .card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
  .card p.hint { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 5px; color: var(--text); }
  .field label .opt { font-weight: 400; color: var(--faint); }
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number],
  .field input[type=date], .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; flex-direction: column; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .checks input { width: 17px; height: 17px; }
  .radios { display: flex; flex-direction: column; gap: 8px; }
  .radios label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .repeat-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface-muted); position: relative; }
  .repeat-item .remove { position: absolute; top: 8px; right: 8px; border: none; background: none; color: var(--danger); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; }
  .add-row { display: inline-flex; align-items: center; gap: 6px; background: var(--mint-soft); color: var(--mint-strong); border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  footer { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; }
  footer button { flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 750; border: none; cursor: pointer; }
  .btn-back { background: var(--surface-muted); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-next { background: linear-gradient(135deg, var(--mint), #34d399); color: #fff; }
  .btn-next:disabled { opacity: .5; cursor: not-allowed; }
  .done-screen { text-align: center; padding: 60px 20px; }
  .done-screen .icon { font-size: 52px; }
  .done-screen h2 { margin: 12px 0 6px; }
  .err-box { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .field-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .print-btn { margin-top: 16px; padding: 11px 22px; border-radius: 10px; border: none; background: var(--mint); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .print-full-form { display: none; }
  @media print {
    .no-print { display: none !important; }
    body * { visibility: hidden !important; }
    .print-full-form, .print-full-form * { visibility: visible !important; }
    /* position:fixed ตัด content ที่ยาวเกิน 1 หน้าทิ้งหมด (fixed ผูกกับ viewport เดียว พิมพ์ได้
       แค่หน้าแรก) — ใช้ absolute แทน ให้ไหลข้ามหน้าได้ตามความสูงจริงของเนื้อหา (บอส 2026-09-18:
       "ขยายเต็มหน้า A4 ... หลายหน้าก็ต้องทำ") */
    .print-full-form { display: block !important; position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; padding: 20px !important; box-sizing: border-box !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">PAYI · สมัครงาน</div>
    <h1 id="stepTitle">ใบสมัครงาน</h1>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>
    <button type="button" id="btnResetDraft" style="margin-top:8px;background:none;border:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer">ล้างข้อมูลที่กรอกไว้ (เริ่มใหม่)</button>
  </header>
  <main>
    <div class="card" id="cardBody"></div>
  </main>
  <footer>
    <button class="btn-back" id="btnBack">ย้อนกลับ</button>
    <button class="btn-next" id="btnNext">ถัดไป</button>
  </footer>
</div>

<script>
const API = '/api/sheet-tools?op=hr-people';
const DRAFT_KEY = 'payi-apply-draft-v1';

const answers = Object.assign({
  documents_ready: [], office_skills: [], computer_programs: [],
  education_history: [], work_history: [],
}, loadDraft());

function loadDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch { return {}; }
}
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(answers)); } catch {}
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function field(labelText, inputEl, optional) {
  const label = el('label', {}, labelText, optional ? el('span', { class: 'opt' }, '  (ไม่บังคับ)') : null);
  return el('div', { class: 'field' }, label, inputEl);
}
function textInput(key, type = 'text', placeholder = '') {
  const i = el('input', { type, placeholder, value: answers[key] || '' });
  i.addEventListener('input', () => { answers[key] = i.value; saveDraft(); });
  return i;
}
function textarea(key, placeholder = '') {
  const i = el('textarea', { placeholder }, answers[key] || '');
  i.addEventListener('input', () => { answers[key] = i.value; saveDraft(); });
  return i;
}
function selectInput(key, options, placeholder = 'เลือก') {
  const s = el('select', {});
  s.appendChild(el('option', { value: '' }, placeholder));
  options.forEach(o => {
    const opt = el('option', { value: o }, o);
    if (answers[key] === o) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener('change', () => { answers[key] = s.value; saveDraft(); });
  return s;
}
function checkGroup(key, options) {
  const wrap = el('div', { class: 'checks' });
  options.forEach(o => {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = (answers[key] || []).includes(o);
    cb.addEventListener('change', () => {
      const set = new Set(answers[key] || []);
      cb.checked ? set.add(o) : set.delete(o);
      answers[key] = [...set];
      saveDraft();
    });
    wrap.appendChild(el('label', {}, cb, o));
  });
  return wrap;
}
function radioGroup(key, options) {
  const wrap = el('div', { class: 'radios' });
  options.forEach(o => {
    const rb = el('input', { type: 'radio', name: key });
    rb.checked = answers[key] === o;
    rb.addEventListener('change', () => { answers[key] = o; saveDraft(); });
    wrap.appendChild(el('label', {}, rb, o));
  });
  return wrap;
}
// ---- "มี/ไม่มี" + ช่องระบุรายละเอียดถ้ามี (ประวัติอาชญากรรม/โรคประจำตัว) — เก็บผลลัพธ์
// สุดท้ายกลับเข้า answers[key] เป็นข้อความเดียว ('ไม่มี' หรือรายละเอียดที่ระบุ) ไม่เพิ่มคอลัมน์
// ใหม่ในชีต ใช้ key เดิมได้เลย ('_has'/'_detail' เป็น state ชั่วคราวฝั่ง UI เท่านั้น ไม่ส่งขึ้นเซิร์ฟเวอร์) ----
function yesNoDetailField(key) {
  const hasKey = key + '_has';
  const detailKey = key + '_detail';
  const wrap = el('div', {});
  const radios = el('div', { class: 'radios' });
  const detailWrap = el('div', { style: 'margin-top:8px;display:none' });
  const detailInput = el('textarea', { placeholder: 'ระบุรายละเอียด' }, answers[detailKey] || '');
  function sync() {
    if (!answers[hasKey]) { answers[key] = ''; detailWrap.style.display = 'none'; return; }
    const has = answers[hasKey] === 'มี (ระบุ)';
    detailWrap.style.display = has ? 'block' : 'none';
    answers[key] = has ? (answers[detailKey] || '') : 'ไม่มี';
  }
  ['ไม่มี', 'มี (ระบุ)'].forEach(o => {
    const rb = el('input', { type: 'radio', name: key });
    rb.checked = answers[hasKey] === o;
    rb.addEventListener('change', () => { answers[hasKey] = o; sync(); saveDraft(); refreshNextState(); });
    radios.appendChild(el('label', {}, rb, o));
  });
  detailInput.addEventListener('input', () => { answers[detailKey] = detailInput.value; sync(); saveDraft(); });
  detailWrap.appendChild(detailInput);
  wrap.appendChild(radios);
  wrap.appendChild(detailWrap);
  sync();
  return wrap;
}

// ---- แถวซ้ำ (การศึกษา / ประสบการณ์ทำงาน) ----
function repeatList(key, fieldsDef, addLabel) {
  const wrap = el('div', {});
  const listEl = el('div', {});
  function render() {
    listEl.innerHTML = '';
    (answers[key] || []).forEach((item, idx) => {
      const box = el('div', { class: 'repeat-item' });
      box.appendChild(el('button', { class: 'remove', type: 'button', onclick: () => { answers[key].splice(idx, 1); saveDraft(); render(); refreshNextState(); } }, '✕'));
      fieldsDef.forEach(([k, label, type]) => {
        const inp = el('input', { type: type || 'text', value: item[k] || '', placeholder: label });
        inp.addEventListener('input', () => { item[k] = inp.value; saveDraft(); });
        box.appendChild(el('div', { class: 'field' }, el('label', {}, label), inp));
      });
      listEl.appendChild(box);
    });
  }
  render();
  // ปุ่ม +/✕ เป็น click ธรรมดา ไม่ผ่าน event delegation ที่ cardBody ดักไว้ (input/change เท่านั้น)
  // ต้องเรียก refreshNextState() ตรงๆ ไม่งั้นปุ่ม "ถัดไป" ค้าง disabled แม้เพิ่มแถวแล้ว
  // (บั๊กจริงที่เจอ 2026-09-17 — ค้างที่ขั้นตอน "ประวัติการศึกษา" ไปต่อไม่ได้)
  const addBtn = el('button', {
    type: 'button', class: 'add-row',
    onclick: () => { (answers[key] = answers[key] || []).push({}); saveDraft(); render(); refreshNextState(); }
  }, '+ ' + addLabel);
  wrap.appendChild(listEl);
  wrap.appendChild(addBtn);
  return wrap;
}

// ---- นิยามขั้นตอนทั้งหมด ----
// 2026-09-17: บอสสั่งบังคับกรอกทุกช่องหมดก่อน (ทำใหม่ทุกจุดบังคับ เดี๋ยวบอกทีหลังว่าจุด
// ไหนไม่บังคับ) — ห้ามเผลอเติม optional flag คืนโดยไม่ได้รับแจ้งจากบอสอีกที
const steps = [
  {
    title: 'ตำแหน่งงาน', sub: 'ข้อมูลตำแหน่งที่ต้องการสมัคร',
    render: (c) => {
      c.appendChild(field('ตำแหน่งงานที่สมัคร', textInput('position')));
      c.appendChild(field('เงินเดือนที่ต้องการ', textInput('expected_salary', 'text', 'เช่น 12,000 หรือ ตามฐานเงินเดือนบริษัท')));
      c.appendChild(field('วันที่เริ่มงานได้', textInput('available_date', 'text', 'เช่น ทันที / ภายใน 15 วัน')));
      c.appendChild(field('สถานภาพการทำงานปัจจุบัน', selectInput('current_status', ['ว่างงาน', 'ทำงานประจำ', 'ทำงาน Part-Time', 'กำลังศึกษาอยู่'])));
    },
    required: () => !!answers.position && !!answers.expected_salary && !!answers.available_date && !!answers.current_status,
  },
  {
    title: 'เอกสารที่เตรียมมา', sub: 'เลือกเอกสารที่มี',
    render: (c) => {
      c.appendChild(checkGroup('documents_ready', ['สำเนาบัตรประชาชน', 'สำเนาทะเบียนบ้าน', 'ใบรับรองวุฒิการศึกษา', 'หนังสือรับรองการทำงาน']));
    },
    required: () => (answers.documents_ready || []).length > 0,
  },
  {
    title: 'ข้อมูลส่วนตัว', sub: 'ข้อมูลพื้นฐานของคุณ',
    render: (c) => {
      c.appendChild(field('คำนำหน้า', selectInput('title', ['นาย', 'นาง', 'นางสาว'])));
      c.appendChild(field('ชื่อ-นามสกุล', textInput('full_name')));
      c.appendChild(field('ชื่อเล่น', textInput('nickname')));
      const row = el('div', { class: 'row2' });
      row.appendChild(field('อายุ', textInput('age', 'number')));
      row.appendChild(field('วันเดือนปีเกิด', textInput('birth_date', 'date')));
      c.appendChild(row);
      c.appendChild(field('สัญชาติ', textInput('nationality', 'text', 'ไทย')));
      c.appendChild(field('เชื้อชาติ', textInput('ethnicity', 'text', 'ไทย')));
      c.appendChild(field('ศาสนา', textInput('religion')));
      c.appendChild(field('ภูมิลำเนาเดิม (จังหวัด)', textInput('hometown')));
    },
    required: () => !!answers.title && !!answers.full_name && !!answers.nickname && !!answers.age && !!answers.birth_date
      && !!answers.nationality && !!answers.ethnicity && !!answers.religion && !!answers.hometown,
  },
  {
    title: 'พี่น้อง', sub: 'ข้อมูลลำดับพี่น้อง',
    render: (c) => {
      c.appendChild(field('จำนวนพี่น้อง', textInput('siblings', 'text', 'เช่น พี่ 1 คน น้อง 2 คน')));
      c.appendChild(field('เป็นบุตรคนที่', textInput('birth_order', 'text', 'เช่น คนที่ 2')));
    },
    required: () => !!answers.siblings && !!answers.birth_order,
  },
  {
    title: 'ที่อยู่และการติดต่อ', sub: 'ที่อยู่ปัจจุบันที่ติดต่อได้',
    render: (c) => {
      c.appendChild(field('ที่อยู่ปัจจุบัน (บ้านเลขที่/ถนน/ซอย)', textarea('address')));
      const row = el('div', { class: 'row2' });
      row.appendChild(field('ตำบล/แขวง', textInput('sub_district')));
      row.appendChild(field('อำเภอ/เขต', textInput('district')));
      c.appendChild(row);
      const row2 = el('div', { class: 'row2' });
      row2.appendChild(field('จังหวัด', textInput('province')));
      row2.appendChild(field('รหัสไปรษณีย์', textInput('postal_code', 'text')));
      c.appendChild(row2);
      c.appendChild(field('เบอร์มือถือ', textInput('mobile_phone', 'tel')));
      c.appendChild(field('โทรศัพท์บ้าน', textInput('home_phone', 'tel'), true));
      c.appendChild(field('Email', textInput('email', 'email'), true));
    },
    required: () => !!answers.address && !!answers.sub_district && !!answers.district && !!answers.province
      && !!answers.postal_code && !!answers.mobile_phone,
  },
  {
    title: 'ที่พักอาศัย/ครอบครัว', sub: '',
    render: (c) => {
      c.appendChild(field('ประเภทที่อยู่อาศัยปัจจุบัน', selectInput('residence_type', ['บ้านตัวเอง', 'บ้านญาติ', 'ห้องเช่า/บ้านเช่า', 'อื่นๆ'])));
      c.appendChild(field('อาศัยมาแล้วกี่ปี', textInput('residence_years', 'number')));
      c.appendChild(field('สถานภาพครอบครัว', selectInput('marital_status', ['โสด', 'แต่งงาน', 'หย่าร้าง', 'แยกกันอยู่'])));
      c.appendChild(field('ชื่อคู่สมรส (ถ้ามี)', textInput('spouse_name'), true));
      c.appendChild(field('อาชีพคู่สมรส', textInput('spouse_occupation'), true));
      c.appendChild(field('จำนวนบุตร', textInput('children_count', 'number')));
    },
    required: () => !!answers.residence_type && !!answers.residence_years && !!answers.marital_status && !!answers.children_count,
  },
  {
    title: 'สุขภาพและประวัติ', sub: '',
    render: (c) => {
      c.appendChild(field('ประวัติอาชญากรรม', yesNoDetailField('criminal_record')));
      c.appendChild(field('โรคประจำตัว', yesNoDetailField('health_condition')));
    },
    required: () => !!answers.criminal_record && !!answers.health_condition,
  },
  {
    title: 'ข้อมูลบิดา-มารดา', sub: 'กรอกเท่าที่ทราบ (ไม่บังคับ ข้ามได้)',
    render: (c) => {
      c.appendChild(field('ชื่อบิดา', textInput('father_name'), true));
      c.appendChild(field('สถานะบิดา / อาชีพ', textInput('father_status', 'text', 'เช่น มีชีวิตอยู่ / ถึงแก่กรรม, อาชีพ'), true));
      c.appendChild(field('ที่อยู่/จังหวัดบิดา', textInput('father_address'), true));
      c.appendChild(field('ชื่อมารดา', textInput('mother_name'), true));
      c.appendChild(field('สถานะมารดา / อาชีพ', textInput('mother_status'), true));
      c.appendChild(field('ที่อยู่/จังหวัดมารดา', textInput('mother_address'), true));
    },
    required: () => true,
  },
  {
    title: 'สถานะทางการทหาร', sub: 'ผู้สมัครเพศหญิงเลือก "ไม่เกี่ยวข้อง/ไม่ระบุ" ได้เลย',
    render: (c) => {
      c.appendChild(radioGroup('military_status', ['ได้รับการยกเว้น', 'ศึกษาวิชาทหาร (รด.)', 'ผ่านการเกณฑ์ทหารแล้ว', 'ไม่เกี่ยวข้อง/ไม่ระบุ']));
    },
    required: () => !!answers.military_status,
  },
  {
    title: 'ประวัติการศึกษา', sub: '',
    render: (c) => {
      // เลือกวุฒิก่อน ค่อยขยายรายละเอียดออกมาให้กรอกต่อ — ไม่มีปุ่ม +/✕ ให้กดเลย (บอส
      // 2026-09-17: "เลือกเสร็จแล้วค่อยขยายส่วนที่เหลือ กากบาทไม่ได้ ไม่ต้องกดเพิ่ม" —
      // เก็บเป็น array 1 ชิ้นเหมือนเดิมข้างหลัง (เข้ากับ backend/JSON เดิม) แค่ UI ไม่โชว์ปุ่ม
      const sel = el('select', {});
      sel.appendChild(el('option', { value: '' }, 'เลือก'));

let stepIdx = 0;
const cardBody = document.getElementById('cardBody');
const btnBack = document.getElementById('btnBack');
const btnNext = document.getElementById('btnNext');
const stepTitle = document.getElementById('stepTitle');
const stepLabel = document.getElementById('stepLabel');
const progressFill = document.getElementById('progressFill');

function refreshNextState() {
  const st = steps[stepIdx];
  btnNext.disabled = !st.required();
  btnNext.textContent = st.isFinal ? 'ส่งใบสมัคร' : 'ถัดไป';
}

function renderStep() {
  const st = steps[stepIdx];
  cardBody.innerHTML = '';
  cardBody.appendChild(el('h2', {}, st.title));
  if (st.sub) cardBody.appendChild(el('p', { class: 'hint' }, st.sub));
  st.render(cardBody);
  stepTitle.textContent = 'ใบสมัครงาน';
  stepLabel.textContent = `ขั้นตอน ${stepIdx + 1} / ${steps.length} — ${st.title}`;
  progressFill.style.width = Math.round(((stepIdx) / (steps.length - 1)) * 100) + '%';
  btnBack.style.visibility = stepIdx === 0 ? 'hidden' : 'visible';
  refreshNextState();
  window.scrollTo(0, 0);
}

// ทุกช่องกรอกในการ์ดปัจจุบัน อัปเดต answers ผ่าน listener ของตัวเอง (ดูฟังก์ชัน textInput/
// selectInput/checkGroup ฯลฯ ด้านบน) แต่ enable/disable ปุ่ม "ถัดไป" ต้องเช็คใหม่ทุกครั้ง —
// ใช้ event delegation ตัวเดียวจับ input/change ทั้งการ์ด แทนที่จะเรียก refreshNextState()
// ซ้ำในทุก listener (ลืมจุดใดจุดหนึ่งแล้วปุ่มค้าง disabled ทั้งที่กรอกครบแล้ว)
cardBody.addEventListener('input', refreshNextState);
cardBody.addEventListener('change', refreshNextState);

btnBack.addEventListener('click', () => { if (stepIdx > 0) { stepIdx--; renderStep(); } });
btnNext.addEventListener('click', async () => {
  const st = steps[stepIdx];
  if (!st.required()) return;
  if (!st.isFinal) { stepIdx++; renderStep(); return; }
  await submit();
});

// สำเนาของ LockedApplicationForm ใน src/pages/HRPeople.jsx (ฝั่ง React ของบอส) มาทำเป็น
// vanilla JS/HTML string แทน — คนละไฟล์ คนละ runtime (ที่นี่ไม่มี React/build step) ไม่มีทาง
// share component กันได้ ต้องแก้ทั้งสองที่ถ้าจะเปลี่ยนแพตเทิร์นทีหลัง โครงสร้าง/label/checkbox
// ต้องตรงกันเป๊ะ — อ้างอิงจากไฟล์ PDF ต้นฉบับที่บอสส่งมา (ใบสมัครงาน 3 หน้า)
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pBlank(value, minWidth, grow) {
  return `<span style="display:inline-block;border-bottom:1px dotted #333;min-width:${minWidth || 60}px;flex:${grow == null ? 1 : grow};padding:0 4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(value) || '&nbsp;'}</span>`;
}
function pChk(label, checked) {
  return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:16px"><span style="font-family:monospace;font-size:14px">${checked ? '☑' : '☐'}</span>${esc(label)}</span>`;
}
function pLine(inner) {
  return `<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;margin-bottom:10px;font-size:12.5px">${inner}</div>`;
}
function pTable(cols, rows, minRows) {
  const data = rows.slice();
  while (data.length < minRows) data.push({});
  const head = cols.map((c) => `<th style="border:1px solid #333;padding:4px 6px;background:#f1f5f9;font-weight:700">${esc(c.label)}</th>`).join('');
  const body = data.map((r) => `<tr>${cols.map((c) => `<td style="border:1px solid #333;padding:4px 6px;height:20px">${esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

        <div>ลายมือชื่อผู้สมัคร</div>
        <div style="margin-top:28px">.......................................................</div>
        <div>(${esc(fullName) || '......................................................'})</div>
        <div style="margin-top:6px">........... / ............... / ...........</div>
      </div>
    </div>
  </div>`;
}

async function submit() {
  btnNext.disabled = true;
  btnNext.textContent = 'กำลังส่ง...';
  const payload = { action: 'submit-applicant' };
  const FIELD_KEYS = [
    'position','expected_salary','available_date','current_status','title','full_name','nickname','age',
    'birth_date','nationality','ethnicity','religion','hometown','siblings','birth_order','address',
    'sub_district','district','province','postal_code','home_phone','mobile_phone','email','residence_type',
    'residence_years','marital_status','spouse_name','spouse_occupation','children_count','father_name',
    'father_status','father_occupation','father_address','mother_name','mother_status','mother_occupation',
    'mother_address','military_status','education_level','education_activities','favorite_subject',
    'english_speak','english_read','english_write','other_language','computer_level','reference_name',
    'reference_occupation','reference_phone','heard_from','criminal_record','health_condition',
  ];
  FIELD_KEYS.forEach(k => { payload[k] = answers[k] || ''; });
  payload.documents_ready = (answers.documents_ready || []).join(', ');
  payload.office_skills = (answers.office_skills || []).join(', ');
  payload.computer_programs = (answers.computer_programs || []).join(', ');
  payload.education_history = JSON.stringify(answers.education_history || []);
  payload.work_history = JSON.stringify(answers.work_history || []);
  payload.confirmed = answers.confirmed ? 'ยืนยันแล้ว' : '';

  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'ส่งไม่สำเร็จ');
    localStorage.removeItem(DRAFT_KEY);
    document.querySelector('.wrap').innerHTML = `
      <main style="padding-top:60px"><div class="card done-screen">
        <div class="icon">✅</div>
        <h2>ส่งใบสมัครเรียบร้อยแล้ว</h2>
        <p class="hint">ขอบคุณที่สนใจร่วมงานกับ PAYI ทีมงานจะติดต่อกลับหากผ่านการพิจารณาเบื้องต้น</p>
        <div style="text-align:left;font-size:13px;line-height:1.8;margin-top:16px">
          <b>${answers.full_name || '-'}</b> — ${answers.position || '-'}<br>
          เบอร์โทร: ${answers.mobile_phone || '-'}<br>
          วันที่ส่ง: ${new Date().toLocaleDateString('th-TH')}
        </div>
        <button class="print-btn no-print" onclick="window.print()">พิมพ์ใบสมัคร (PDF)</button>
      </div>
      <div class="print-full-form">${buildLockedFormHTML(answers)}</div>
      </main>`;
  } catch (e) {
    cardBody.insertBefore(el('div', { class: 'err-box' }, e.message || 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'), cardBody.firstChild.nextSibling);
    btnNext.disabled = false;
    btnNext.textContent = 'ส่งใบสมัคร';
  }
}

document.getElementById('btnResetDraft').addEventListener('click', () => {
  if (!confirm('ล้างข้อมูลที่กรอกไว้ทั้งหมด แล้วเริ่มกรอกใหม่?')) return;
  localStorage.removeItem(DRAFT_KEY);
  location.reload();
});

renderStep();
</script>
</body>
</html>
