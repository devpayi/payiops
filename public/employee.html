<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>ข้อมูลพนักงาน — PAYI</title>
<style>
  :root {
    --mint: #2563eb; --mint-strong: #0b63d8; --mint-soft: #eaf3ff;
    --surface: #ffffff; --surface-muted: #f7fbff; --border: #dbe3ef;
    --text: #111827; --muted: #64748b; --faint: #94a3b8; --danger: #ef4444;
    --bg: #eef4fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 20px 20px 14px; }
  header .brand { font-size: 12px; font-weight: 800; color: var(--mint-strong); letter-spacing: .06em; text-transform: uppercase; }
  header h1 { margin: 4px 0 10px; font-size: 22px; font-weight: 850; }
  .progress-track { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--mint), #34d399); transition: width .25s ease; }
  .step-label { margin-top: 8px; font-size: 12px; color: var(--muted); }
  main { flex: 1; padding: 4px 20px 100px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12); }
  .card h2 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
  .card p.hint { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 5px; color: var(--text); }
  .field label .opt { font-weight: 400; color: var(--faint); }
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number],
  .field input[type=date], .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    font: inherit; font-size: 14px; background: var(--surface); color: var(--text);
  }
  .field input[type=file] { width: 100%; font-size: 13px; }
  .field textarea { resize: vertical; min-height: 70px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; flex-direction: column; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .checks input { width: 17px; height: 17px; }
  .radios { display: flex; flex-direction: column; gap: 8px; }
  .radios label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .repeat-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--surface-muted); position: relative; }
  .repeat-item .remove { position: absolute; top: 8px; right: 8px; border: none; background: none; color: var(--danger); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px; }
  .add-row { display: inline-flex; align-items: center; gap: 6px; background: var(--mint-soft); color: var(--mint-strong); border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  footer { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; }
  footer button { flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 750; border: none; cursor: pointer; }
  .btn-back { background: var(--surface-muted); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-next { background: linear-gradient(135deg, var(--mint), #34d399); color: #fff; }
  .btn-next:disabled { opacity: .5; cursor: not-allowed; }
  .done-screen { text-align: center; padding: 60px 20px; }
  .done-screen .icon { font-size: 52px; }
  .done-screen h2 { margin: 12px 0 6px; }
  .err-box { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .field-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .file-status { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">PAYI · ข้อมูลพนักงาน</div>
    <h1 id="stepTitle">ข้อมูลพนักงาน</h1>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <main>
    <div class="card" id="cardBody"></div>
  </main>
  <footer>
    <button class="btn-back" id="btnBack">ย้อนกลับ</button>
    <button class="btn-next" id="btnNext">ถัดไป</button>
  </footer>
</div>

<script>
const API = '/api/sheet-tools?op=hr-people';
const DRAFT_KEY = 'payi-employee-draft-v1';

const answers = Object.assign({
  office_skills: [], computer_programs: [],
  education_history: [], work_history: [],
}, loadDraft());

function loadDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch { return {}; }
}
function saveDraft() {
  // หมายเหตุ: รูปบัตร/ทะเบียนบ้านเข้ารหัส base64 เก็บใน answers ด้วย — ถ้าไฟล์ใหญ่มาก
  // localStorage อาจเต็ม (5MB) ตรงนี้ปล่อยผ่านเงียบๆ (try/catch) แค่แปลว่า draft ไม่ auto-save
  // ช่วงนั้น ไม่กระทบตอนกด "ส่งข้อมูล" จริงซึ่งอ่านจาก answers ในหน่วยความจำตรงๆ
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(answers)); } catch {}
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

function field(labelText, inputEl, optional) {
  const label = el('label', {}, labelText, optional ? el('span', { class: 'opt' }, '  (ไม่บังคับ)') : null);
  return el('div', { class: 'field' }, label, inputEl);
}
function textInput(key, type = 'text', placeholder = '') {
  const i = el('input', { type, placeholder, value: answers[key] || '' });
  i.addEventListener('input', () => { answers[key] = i.value; saveDraft(); });
  return i;
}
function textarea(key, placeholder = '') {
  const i = el('textarea', { placeholder }, answers[key] || '');
  i.addEventListener('input', () => { answers[key] = i.value; saveDraft(); });
  return i;
}
function selectInput(key, options, placeholder = 'เลือก') {
  const s = el('select', {});
  s.appendChild(el('option', { value: '' }, placeholder));
  options.forEach(o => {
    const opt = el('option', { value: o }, o);
    if (answers[key] === o) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener('change', () => { answers[key] = s.value; saveDraft(); });
  return s;
}
function checkGroup(key, options) {
  const wrap = el('div', { class: 'checks' });
  options.forEach(o => {
    const cb = el('input', { type: 'checkbox' });
    cb.checked = (answers[key] || []).includes(o);
    cb.addEventListener('change', () => {
      const set = new Set(answers[key] || []);
      cb.checked ? set.add(o) : set.delete(o);
      answers[key] = [...set];
      saveDraft();
    });
    wrap.appendChild(el('label', {}, cb, o));
  });
  return wrap;
}
function radioGroup(key, options) {
  const wrap = el('div', { class: 'radios' });
  options.forEach(o => {
    const rb = el('input', { type: 'radio', name: key });
    rb.checked = answers[key] === o;
    rb.addEventListener('change', () => { answers[key] = o; saveDraft(); });
    wrap.appendChild(el('label', {}, rb, o));
  });
  return wrap;
}
// ---- ไฟล์รูป (บัตร ปชช/ทะเบียนบ้าน) — แปลงเป็น base64 เก็บใน answers ตรงๆ ไม่ผ่าน Drive
// จนกว่าจะกดส่งข้อมูล (เซิร์ฟเวอร์เป็นคนอัพโหลดจริงผ่าน Apps Script bridge) ----
function fileInputField(key) {
  const wrap = el('div', {});
  const status = el('div', { class: 'file-status' }, answers[key] ? `เลือกไฟล์แล้ว: ${answers[key].fileName}` : 'ยังไม่ได้เลือกไฟล์ (ถ่ายรูปหรือเลือกจากเครื่อง)');
  const inp = el('input', { type: 'file', accept: 'image/*' });
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      answers[key] = { fileName: f.name, mimeType: f.type, base64Data: String(reader.result).split(',')[1] || '' };
      status.textContent = `เลือกไฟล์แล้ว: ${f.name}`;
      saveDraft();
      refreshNextState();
    };
    reader.readAsDataURL(f);
  });
  wrap.appendChild(inp);
  wrap.appendChild(status);
  return wrap;
}

// ---- แถวซ้ำ (การศึกษา / ประสบการณ์ทำงาน) ----
function repeatList(key, fieldsDef, addLabel) {
  const wrap = el('div', {});
  const listEl = el('div', {});
  function render() {
    listEl.innerHTML = '';
    (answers[key] || []).forEach((item, idx) => {
      const box = el('div', { class: 'repeat-item' });
      box.appendChild(el('button', { class: 'remove', type: 'button', onclick: () => { answers[key].splice(idx, 1); saveDraft(); render(); } }, '✕'));
      fieldsDef.forEach(([k, label, type]) => {
        const inp = el('input', { type: type || 'text', value: item[k] || '', placeholder: label });
        inp.addEventListener('input', () => { item[k] = inp.value; saveDraft(); });
        box.appendChild(el('div', { class: 'field' }, el('label', {}, label), inp));
      });
      listEl.appendChild(box);
    });
  }
  render();
  const addBtn = el('button', {
    type: 'button', class: 'add-row',
    onclick: () => { (answers[key] = answers[key] || []).push({}); saveDraft(); render(); }
  }, '+ ' + addLabel);
  wrap.appendChild(listEl);
  wrap.appendChild(addBtn);
  return wrap;
}

// ---- นิยามขั้นตอนทั้งหมด ----
// 2026-09-17: บอสสั่งบังคับกรอกทุกช่องหมดก่อน (ทำใหม่ทุกจุดบังคับ เดี๋ยวบอกทีหลังว่าจุด
// ไหนไม่บังคับ) — ห้ามเผลอเติม optional flag คืนโดยไม่ได้รับแจ้งจากบอสอีกที
const steps = [
  {
    title: 'ตำแหน่งงาน', sub: '',
    render: (c) => {
      c.appendChild(field('ตำแหน่งงาน', textInput('position')));
      c.appendChild(field('วันที่เริ่มงาน', textInput('start_date', 'date')));
    },
    required: () => !!answers.position && !!answers.start_date,
  },
  {
    title: 'เอกสารประจำตัว', sub: 'บัตรประชาชน / ทะเบียนบ้าน',
    render: (c) => {
      c.appendChild(field('เลขบัตรประชาชน', textInput('id_card_number')));
      c.appendChild(field('รูปบัตรประชาชน', fileInputField('id_card_photo')));
      c.appendChild(field('ที่อยู่ตามทะเบียนบ้าน', textarea('house_registration_address')));
      c.appendChild(field('รูปทะเบียนบ้าน', fileInputField('house_registration_photo')));
    },
    required: () => !!answers.id_card_number && !!answers.id_card_photo
      && !!answers.house_registration_address && !!answers.house_registration_photo,
  },
  {
    title: 'ข้อมูลส่วนตัว', sub: 'ข้อมูลพื้นฐานของคุณ',
    render: (c) => {
      c.appendChild(field('คำนำหน้า', selectInput('title', ['นาย', 'นาง', 'นางสาว'])));
      c.appendChild(field('ชื่อ-นามสกุล', textInput('full_name')));
      c.appendChild(field('ชื่อเล่น', textInput('nickname')));
      const row = el('div', { class: 'row2' });
      row.appendChild(field('อายุ', textInput('age', 'number')));
      row.appendChild(field('วันเดือนปีเกิด', textInput('birth_date', 'date')));
      c.appendChild(row);
      c.appendChild(field('สัญชาติ', textInput('nationality', 'text', 'ไทย')));
      c.appendChild(field('เชื้อชาติ', textInput('ethnicity', 'text', 'ไทย')));
      c.appendChild(field('ศาสนา', textInput('religion')));
      c.appendChild(field('ภูมิลำเนาเดิม (จังหวัด)', textInput('hometown')));
    },
    required: () => !!answers.title && !!answers.full_name && !!answers.nickname && !!answers.age && !!answers.birth_date
      && !!answers.nationality && !!answers.ethnicity && !!answers.religion && !!answers.hometown,
  },
  {
    title: 'พี่น้อง', sub: 'ข้อมูลลำดับพี่น้อง',
    render: (c) => {
      c.appendChild(field('จำนวนพี่น้อง', textInput('siblings', 'text', 'เช่น พี่ 1 คน น้อง 2 คน')));
      c.appendChild(field('เป็นบุตรคนที่', textInput('birth_order', 'text', 'เช่น คนที่ 2')));
    },
    required: () => !!answers.siblings && !!answers.birth_order,
  },
  {
    title: 'ที่อยู่และการติดต่อ', sub: 'ที่อยู่ปัจจุบันที่ติดต่อได้',
    render: (c) => {
      c.appendChild(field('ที่อยู่ปัจจุบัน (บ้านเลขที่/ถนน/ซอย)', textarea('address')));
      const row = el('div', { class: 'row2' });
      row.appendChild(field('ตำบล/แขวง', textInput('sub_district')));
      row.appendChild(field('อำเภอ/เขต', textInput('district')));
      c.appendChild(row);
      const row2 = el('div', { class: 'row2' });
      row2.appendChild(field('จังหวัด', textInput('province')));
      row2.appendChild(field('รหัสไปรษณีย์', textInput('postal_code', 'text')));
      c.appendChild(row2);
      c.appendChild(field('เบอร์มือถือ', textInput('mobile_phone', 'tel')));
      c.appendChild(field('โทรศัพท์บ้าน', textInput('home_phone', 'tel')));
      c.appendChild(field('Email', textInput('email', 'email')));
    },
    required: () => !!answers.address && !!answers.sub_district && !!answers.district && !!answers.province
      && !!answers.postal_code && !!answers.mobile_phone && !!answers.home_phone && !!answers.email,
  },
  {
    title: 'ที่พักอาศัย/ครอบครัว', sub: '',
    render: (c) => {
      c.appendChild(field('ประเภทที่อยู่อาศัยปัจจุบัน', selectInput('residence_type', ['บ้านตัวเอง', 'บ้านญาติ', 'ห้องเช่า/บ้านเช่า', 'อื่นๆ'])));
      c.appendChild(field('อาศัยมาแล้วกี่ปี', textInput('residence_years', 'number')));
      c.appendChild(field('สถานภาพครอบครัว', selectInput('marital_status', ['โสด', 'แต่งงาน', 'หย่าร้าง', 'แยกกันอยู่'])));
      c.appendChild(field('ชื่อคู่สมรส (ถ้ามี)', textInput('spouse_name')));
      c.appendChild(field('อาชีพคู่สมรส', textInput('spouse_occupation')));
      c.appendChild(field('จำนวนบุตร', textInput('children_count', 'number')));
    },
    required: () => !!answers.residence_type && !!answers.residence_years && !!answers.marital_status
      && !!answers.spouse_name && !!answers.spouse_occupation && !!answers.children_count,
  },
  {
    title: 'สุขภาพและประวัติ', sub: 'กรอกตามความเป็นจริง — ถ้าไม่มี พิมพ์ "ไม่มี"',
    render: (c) => {
      const row = el('div', { class: 'row2' });
      row.appendChild(field('น้ำหนัก (กก.)', textInput('weight', 'number')));
      row.appendChild(field('ส่วนสูง (ซม.)', textInput('height', 'number')));
      c.appendChild(row);
      c.appendChild(field('กรุ๊ปเลือด', selectInput('blood_type', ['A', 'B', 'AB', 'O'])));
      c.appendChild(field('ประวัติอาชญากรรม', textarea('criminal_record', 'ถ้าไม่มี พิมพ์ "ไม่มี"')));
      c.appendChild(field('โรคประจำตัว', textarea('health_condition', 'ถ้าไม่มี พิมพ์ "ไม่มี"')));
    },
    required: () => !!answers.weight && !!answers.height && !!answers.blood_type
      && !!answers.criminal_record && !!answers.health_condition,
  },
  {
    title: 'ข้อมูลบิดา-มารดา', sub: 'กรอกเท่าที่ทราบ',
    render: (c) => {
      c.appendChild(field('ชื่อบิดา', textInput('father_name')));
      c.appendChild(field('สถานะบิดา / อาชีพ', textInput('father_status', 'text', 'เช่น มีชีวิตอยู่ / ถึงแก่กรรม, อาชีพ')));
      c.appendChild(field('ที่อยู่/จังหวัดบิดา', textInput('father_address')));
      c.appendChild(field('ชื่อมารดา', textInput('mother_name')));
      c.appendChild(field('สถานะมารดา / อาชีพ', textInput('mother_status')));
      c.appendChild(field('ที่อยู่/จังหวัดมารดา', textInput('mother_address')));
    },
    required: () => !!answers.father_name && !!answers.father_status && !!answers.father_address
      && !!answers.mother_name && !!answers.mother_status && !!answers.mother_address,
  },
  {
    title: 'สถานะทางการทหาร', sub: 'เพศหญิงเลือก "ไม่เกี่ยวข้อง/ไม่ระบุ" ได้เลย',
    render: (c) => {
      c.appendChild(radioGroup('military_status', ['ได้รับการยกเว้น', 'ศึกษาวิชาทหาร (รด.)', 'ผ่านการเกณฑ์ทหารแล้ว', 'ไม่เกี่ยวข้อง/ไม่ระบุ']));
    },
    required: () => !!answers.military_status,
  },
  {
    title: 'ประวัติการศึกษา', sub: 'เพิ่มได้หลายรายการ เรียงจากล่าสุด',
    render: (c) => {
      c.appendChild(field('วุฒิการศึกษาสูงสุด', textInput('education_level')));
      c.appendChild(repeatList('education_history', [
        ['level', 'ระดับการศึกษา (เช่น ปวส./ปริญญาตรี)'],
        ['school', 'สถาบันการศึกษา'],
        ['major', 'สาขาวิชาเอก'],
        ['year', 'ปีที่จบการศึกษา'],
        ['gpa', 'เกรดเฉลี่ย'],
      ], 'เพิ่มรายการการศึกษา'));
      c.appendChild(field('กิจกรรม/รางวัลระหว่างการศึกษา', textarea('education_activities')));
      c.appendChild(field('สาขาวิชาที่ชอบเป็นพิเศษ', textInput('favorite_subject')));
    },
    required: () => !!answers.education_level && (answers.education_history || []).length > 0
      && !!answers.education_activities && !!answers.favorite_subject,
  },
  {
    title: 'ประสบการณ์การทำงาน', sub: 'เพิ่มอย่างน้อย 1 รายการ',
    render: (c) => {
      c.appendChild(repeatList('work_history', [
        ['company', 'ชื่อสถานประกอบการ'],
        ['salary', 'เงินเดือน'],
        ['from', 'ทำงานตั้งแต่ (เดือน/ปี)'],
        ['to', 'ถึง (เดือน/ปี)'],
        ['position', 'หน้าที่/ตำแหน่ง'],
        ['reason_left', 'สาเหตุที่ออก'],
      ], 'เพิ่มประสบการณ์ทำงาน'));
    },
    required: () => (answers.work_history || []).length > 0,
  },
  {
    title: 'ทักษะและความสามารถ', sub: '',
    render: (c) => {
      c.appendChild(el('div', { class: 'field' }, el('label', {}, 'ภาษาอังกฤษ')));
      const grid = el('div', { class: 'field-select-grid' });
      grid.appendChild(selectInput('english_speak', ['ดีมาก', 'ดี', 'พอใช้', 'ไม่ได้'], 'การพูด'));
      grid.appendChild(selectInput('english_read', ['ดีมาก', 'ดี', 'พอใช้', 'ไม่ได้'], 'การอ่าน'));
      grid.appendChild(selectInput('english_write', ['ดีมาก', 'ดี', 'พอใช้', 'ไม่ได้'], 'การเขียน'));
      c.appendChild(grid);
      c.appendChild(field('ภาษาอื่นๆ', textInput('other_language')));
      c.appendChild(field('ความสามารถใช้เครื่องใช้สำนักงาน', checkGroup('office_skills', ['เครื่องถ่ายเอกสาร', 'โทรสาร', 'พิมพ์ดีด'])));
      c.appendChild(field('ความสามารถใช้คอมพิวเตอร์', selectInput('computer_level', ['ดีมาก', 'ดี', 'พอใช้', 'ไม่ได้'])));
      c.appendChild(field('โปรแกรมที่ใช้ได้', checkGroup('computer_programs', ['Excel', 'Word', 'PowerPoint', 'Photoshop', 'โปรแกรมบัญชี', 'AI (ChatGPT ฯลฯ)', 'Canva/คอนเทนต์โซเชียล', 'อื่นๆ'])));
    },
    required: () => !!answers.english_speak && !!answers.english_read && !!answers.english_write && !!answers.other_language
      && (answers.office_skills || []).length > 0 && !!answers.computer_level && (answers.computer_programs || []).length > 0,
  },
  {
    title: 'บุคคลอ้างอิง', sub: '',
    render: (c) => {
      c.appendChild(field('ชื่อบุคคลอ้างอิง / ความสัมพันธ์', textInput('reference_name')));
      c.appendChild(field('อาชีพบุคคลอ้างอิง', textInput('reference_occupation')));
      c.appendChild(field('เบอร์โทรบุคคลอ้างอิง', textInput('reference_phone', 'tel')));
    },
    required: () => !!answers.reference_name && !!answers.reference_occupation && !!answers.reference_phone,
  },
  {
    title: 'บัญชีธนาคาร', sub: 'สำหรับโอนเงินเดือน',
    render: (c) => {
      c.appendChild(field('ธนาคาร', textInput('bank_name')));
      c.appendChild(field('เลขบัญชี', textInput('bank_account_number')));
      c.appendChild(field('ชื่อบัญชี', textInput('bank_account_name')));
    },
    required: () => !!answers.bank_name && !!answers.bank_account_number && !!answers.bank_account_name,
  },
  {
    title: 'บุคคลที่ติดต่อได้กรณีฉุกเฉิน', sub: '',
    render: (c) => {
      c.appendChild(field('ชื่อ', textInput('emergency_contact_name')));
      c.appendChild(field('ความสัมพันธ์', textInput('emergency_contact_relation')));
      c.appendChild(field('เบอร์โทร', textInput('emergency_contact_phone', 'tel')));
    },
    required: () => !!answers.emergency_contact_name && !!answers.emergency_contact_relation && !!answers.emergency_contact_phone,
  },
  {
    title: 'ยืนยันและส่งข้อมูล', sub: 'ตรวจสอบก่อนกดส่ง',
    render: (c) => {
      c.appendChild(el('div', { class: 'field' }, el('div', { style: 'font-size:14px;line-height:1.7' },
        el('b', {}, answers.full_name || '-'), ' — ', answers.position || '-', el('br'),
        'เบอร์โทร: ', answers.mobile_phone || '-'
      )));
      const cb = el('input', { type: 'checkbox' });
      cb.checked = !!answers.confirmed;
      cb.addEventListener('change', () => { answers.confirmed = cb.checked; saveDraft(); refreshNextState(); });
      c.appendChild(el('div', { class: 'checks' }, el('label', {}, cb, 'ข้าพเจ้าขอรับรองว่าข้อมูลที่กรอกเป็นความจริงทุกประการ')));
    },
    required: () => !!answers.confirmed,
    isFinal: true,
  },
];

let stepIdx = 0;
const cardBody = document.getElementById('cardBody');
const btnBack = document.getElementById('btnBack');
const btnNext = document.getElementById('btnNext');
const stepTitle = document.getElementById('stepTitle');
const stepLabel = document.getElementById('stepLabel');
const progressFill = document.getElementById('progressFill');

function refreshNextState() {
  const st = steps[stepIdx];
  btnNext.disabled = !st.required();
  btnNext.textContent = st.isFinal ? 'ส่งข้อมูล' : 'ถัดไป';
}

function renderStep() {
  const st = steps[stepIdx];
  cardBody.innerHTML = '';
  cardBody.appendChild(el('h2', {}, st.title));
  if (st.sub) cardBody.appendChild(el('p', { class: 'hint' }, st.sub));
  st.render(cardBody);
  stepTitle.textContent = 'ข้อมูลพนักงาน';
  stepLabel.textContent = `ขั้นตอน ${stepIdx + 1} / ${steps.length} — ${st.title}`;
  progressFill.style.width = Math.round(((stepIdx) / (steps.length - 1)) * 100) + '%';
  btnBack.style.visibility = stepIdx === 0 ? 'hidden' : 'visible';
  refreshNextState();
  window.scrollTo(0, 0);
}

cardBody.addEventListener('input', refreshNextState);
cardBody.addEventListener('change', refreshNextState);

btnBack.addEventListener('click', () => { if (stepIdx > 0) { stepIdx--; renderStep(); } });
btnNext.addEventListener('click', async () => {
  const st = steps[stepIdx];
  if (!st.required()) return;
  if (!st.isFinal) { stepIdx++; renderStep(); return; }
  await submit();
});

async function submit() {
  btnNext.disabled = true;
  btnNext.textContent = 'กำลังส่ง...';
  const payload = { action: 'submit-employee' };
  const FIELD_KEYS = [
    'position','start_date','id_card_number','house_registration_address','title','full_name','nickname',
    'age','birth_date','nationality','ethnicity','religion','hometown','siblings','birth_order','address',
    'sub_district','district','province','postal_code','home_phone','mobile_phone','email','residence_type',
    'residence_years','marital_status','spouse_name','spouse_occupation','children_count','blood_type',
    'weight','height','criminal_record','health_condition','father_name','father_status','father_occupation',
    'father_address','mother_name','mother_status','mother_occupation','mother_address','military_status',
    'education_level','education_activities','favorite_subject','english_speak','english_read','english_write',
    'other_language','computer_level','reference_name','reference_occupation','reference_phone','bank_name',
    'bank_account_number','bank_account_name','emergency_contact_name','emergency_contact_relation',
    'emergency_contact_phone',
  ];
  FIELD_KEYS.forEach(k => { payload[k] = answers[k] || ''; });
  payload.office_skills = (answers.office_skills || []).join(', ');
  payload.computer_programs = (answers.computer_programs || []).join(', ');
  payload.education_history = JSON.stringify(answers.education_history || []);
  payload.work_history = JSON.stringify(answers.work_history || []);
  payload.confirmed = answers.confirmed ? 'ยืนยันแล้ว' : '';
  // รูปถ่าย (ถ้ามี) — {fileName, mimeType, base64Data} เซิร์ฟเวอร์เป็นคนอัพโหลดเข้า Drive จริง
  payload.id_card_photo = answers.id_card_photo || null;
  payload.house_registration_photo = answers.house_registration_photo || null;

  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'ส่งไม่สำเร็จ');
    localStorage.removeItem(DRAFT_KEY);
    document.querySelector('.wrap').innerHTML = `
      <main style="padding-top:60px"><div class="card done-screen">
        <div class="icon">✅</div>
        <h2>บันทึกข้อมูลเรียบร้อยแล้ว</h2>
        <p class="hint">ยินดีต้อนรับเข้าร่วมทีม PAYI</p>
      </div></main>`;
  } catch (e) {
    cardBody.insertBefore(el('div', { class: 'err-box' }, e.message || 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'), cardBody.firstChild.nextSibling);
    btnNext.disabled = false;
    btnNext.textContent = 'ส่งข้อมูล';
  }
}

renderStep();
</script>
</body>
</html>
